name: Blender Character Pipeline (experimental)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/blender-character.yml"
      - "tools/blender_character_pipeline.py"

permissions:
  contents: read

jobs:
  blender-original-avatar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy
          blender --version
      - name: Generate Aetherfall original rigged character
        run: |
          python3 tools/generate_avatar_v033.py
          python3 tests/test_avatar_v033.py
      - name: Build editable Blender asset and export GLB
        run: |
          blender -b -t 2 --python tools/blender_character_pipeline.py
          test -s builds/Aetherfall-Anime-Character-Editable.blend
          test -s builds/Aetherfall-Anime-Character-Blender.glb
      - name: Install Godot for Blender GLB compatibility test
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false
      - name: Test Blender-exported model in Godot without changing release sources
        run: |
          set -euo pipefail
          # A .blend under project root triggers Godot Blender importer; keep it\n          # outside the project during headless Godot import. The GLB is the\n          # intended exchange format and does not need Blender configured.\n          mv builds/Aetherfall-Anime-Character-Editable.blend "$RUNNER_TEMP/aetherfall-working.blend"\n          cp builds/Aetherfall-Anime-Character-Blender.glb assets/characters/aetherfall_blender_test.glb
          python3 - <<'PY'
          from pathlib import Path
          path=Path("scripts/avatar_v03.gd")
          source=path.read_text()
          old="res://assets/characters/aetherfall_adventurer.gltf"
          assert old in source
          path.write_text(source.replace(old,"res://assets/characters/aetherfall_blender_test.glb"))
          PY
          timeout 150s godot --headless --editor --path . --import --quit 2>&1 | tee godot-import.log\n          if grep -E "SCRIPT ERROR:|Parse Error:|Blender path is invalid" godot-import.log; then exit 1; fi
          timeout 90s godot --headless --path . --script res://tests/model_asset_test.gd
          timeout 90s godot --headless --path . --script res://tests/studio_preview_test.gd\n          mv "$RUNNER_TEMP/aetherfall-working.blend" builds/Aetherfall-Anime-Character-Editable.blend
      - name: Upload Blender working file and GLB
        uses: actions/upload-artifact@v4
        with:
          name: Aetherfall-Blender-Character-Prototype
          path: |
            builds/Aetherfall-Anime-Character-Editable.blend
            builds/Aetherfall-Anime-Character-Blender.glb
          retention-days: 21
          if-no-files-found: error
