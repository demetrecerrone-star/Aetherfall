name: Verify recovered v0.6.5 Avatar Creator assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-creator-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check original v0.6.5 creator source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, struct
          required = [
            Path("cleanroom/models/creator_v065/male_modular.bin"),
            Path("cleanroom/models/creator_v065/male_refined.bin"),
            Path("cleanroom/creator_v065/studio.gd"),
            Path("cleanroom/creator_v065/studio_avatar.gd")
          ]
          for path in required:
            assert path.is_file(), str(path)
            print(path, path.stat().st_size)
          for path in required[:2]:
            b=path.read_bytes()
            assert b[:4]==b"glTF" and struct.unpack_from("<I",b,8)[0]==len(b)
            n=struct.unpack_from("<I",b,12)[0]
            data=json.loads(b[20:20+n].decode("utf-8"))
            assert any(len(s["joints"])==65 for s in data.get("skins",[]))
          print("AETHERFALL_V065_ASSETS_OK: original creator male models recovered and valid")
          PY
