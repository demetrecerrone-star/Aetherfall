name: Unity API reporter self-test

on:
  push:
    branches: [unity-reboot]
    paths:
      - 'tools/unity_cloud_report.py'
      - '.github/workflows/unity-report-selftest.yml'
      - 'docs/UNITY_CLOUD_API_SETUP.md'

permissions:
  contents: read

jobs:
  check-report:
    name: Test reporter without Unity credentials
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python reporter
        run: python3 -m py_compile tools/unity_cloud_report.py
      - name: Run reporter self-tests
        run: python3 tools/unity_cloud_report.py --self-test
      - name: Verify missing secrets are handled safely
        env:
          UNITY_CLOUD_ORG_ID: '2476066025878'
          UNITY_CLOUD_PROJECT_ID: '92204c56-3bcf-41b8-8eec-43d1069287a1'
          UNITY_CLOUD_TARGET_ID: 'aetherfall-android'
        run: |
          if python3 tools/unity_cloud_report.py --build 1; then
            echo 'Reporter must fail when Unity secrets are absent'
            exit 1
          fi
          echo 'PASS: missing Unity secrets are detected and block the API check'
