name: Android Emulator Visual QA

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-emulator-qa.yml"
      - "tools/android_emulator_smoke.sh"
      - "tools/verify_emulator_frames.py"
      - "tools/generate_avatar.py"
      - "tools/generate_avatar_v033.py"
      - "scripts/avatar_v03.gd"
      - "tests/test_avatar_v033.py"

permissions:
  contents: read

jobs:
  emulator-visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout Aetherfall
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Godot 4.6.3 plus Android templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Configure Android SDK and build signing
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$HOME/.config/godot/editor_settings-4.6.tres"
          printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_HOME" >> "$HOME/.config/godot/editor_settings-4.6.tres"
          printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME" >> "$HOME/.config/godot/editor_settings-4.6.tres"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 9999
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Build x86_64 Compatibility renderer APK for emulator
        run: |
          set -euxo pipefail
          python3 tools/generate_avatar_v033.py
          python3 tests/test_avatar_v033.py
          python3 - <<'PY'
          from pathlib import Path
          path=Path('export_presets.cfg')
          contents=path.read_text()
          assert 'architectures/arm64-v8a=true' in contents
          assert 'architectures/x86_64=false' in contents
          contents=contents.replace('architectures/arm64-v8a=true','architectures/arm64-v8a=false')
          contents=contents.replace('architectures/x86_64=false','architectures/x86_64=true')
          path.write_text(contents)
          PY
          godot --headless --editor --path . --quit
          mkdir -p builds
          godot --headless --path . --export-debug Android builds/Aetherfall-v0.3.3-emulator-x86_64-debug.apk
          test -s builds/Aetherfall-v0.3.3-emulator-x86_64-debug.apk

      - name: Enable hardware virtualization for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Start Android 15 emulator and run recorded gameplay checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash tools/android_emulator_smoke.sh

      - name: Upload emulator screenshots, movement recording and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aetherfall-v0.3.3-Emulator-Visual-QA
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14
