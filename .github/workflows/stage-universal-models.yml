name: One-time stage Universal Base character models
on:
  push:
    branches: [feature/universal-characters-rebuild]
    paths: [".github/workflows/stage-universal-models.yml"]
permissions:
  contents: write
jobs:
  stage-original-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original CC0 prepared Quaternius rigs
        env:
          ARCHIVE_URL: 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-deb4-820c-ad36-fee079ab5d25/raw?se=2026-10-12T01%3A17%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=81f20168-082a-520e-8ccd-945694aada42&skoid=db055408-822b-485f-92f8-bfeb3ea92408&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T01%3A06%3A17Z&ske=2026-10-13T01%3A06%3A17Z&sks=b&skv=2026-02-06&sig=Kehna3TEi656fj6l7GT%2BbT%2BVkd6escccWz7Azb9Tly4%3D'
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --connect-timeout 12 "$ARCHIVE_URL" -o /tmp/universal.zip
          python3 - <<'PY'
          import json,zipfile,struct,hashlib
          from pathlib import Path
          zp=zipfile.ZipFile("/tmp/universal.zip")
          models={"Male":"male_runtime.bin","Female":"female_runtime.bin"}
          for sex,file in models.items():
              name="models/Aetherfall_Universal_"+sex+".glb"
              data=zp.read(name)
              assert data[:4]==b"glTF" and struct.unpack_from("<I",data,8)[0]==len(data)
              size=struct.unpack_from("<I",data,12)[0]
              d=json.loads(data[20:20+size])
              assert len(d["skins"][0]["joints"])==65
              assert len(d["animations"])==25
              required={"Idle_Loop","Walk_Loop","Sprint_Loop","Sword_Attack","Sword_Block"}
              assert required <= {x["name"] for x in d["animations"]}
              out=Path("cleanroom/models/universal")/file
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_bytes(data)
              print(sex,out.stat().st_size,hashlib.sha256(data).hexdigest())
          print("AETHERFALL_UNIVERSAL_ASSETS_READY: 2 models, 65 joints each, 25 clips each")
          PY
      - name: Persist originals in isolated GitHub branch and remove temporary uploader
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cleanroom/models/universal/male_runtime.bin cleanroom/models/universal/female_runtime.bin
          git rm -f .github/workflows/stage-universal-models.yml
          git commit -m "assets(universal): add complete male and female 65-joint animations"
          git push origin "HEAD:${GITHUB_REF_NAME}"
