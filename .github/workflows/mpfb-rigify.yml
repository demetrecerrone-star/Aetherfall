name: MPFB + Rigify Character Foundation

on:
  push:
    paths:
      - ".github/workflows/mpfb-rigify.yml"
      - "tools/check_mpfb_rigify.py"
      - "tools/generate_mpfb_rigify_anime.py"
      - "tests/mpfb_prototype_model_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Cache Blender 4.5 LTS
        uses: actions/cache@v4
        with:
          path: /tmp/aetherfall-blender-4.5
          key: blender-4.5.13-linux-x64
      - name: Install compatible Blender 4.5 LTS
        run: |
          set -euo pipefail
          if [[ ! -x /tmp/aetherfall-blender-4.5/blender ]]; then
            curl -fL --retry 3 --connect-timeout 30 \
              https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz \
              -o /tmp/aetherfall-blender-4.5.tar.xz
            mkdir -p /tmp/aetherfall-blender-4.5
            tar -xJf /tmp/aetherfall-blender-4.5.tar.xz -C /tmp/aetherfall-blender-4.5 --strip-components=1
          fi
          /tmp/aetherfall-blender-4.5/blender -b --factory-startup --python-expr 'import bpy; assert bpy.app.version >= (4, 2, 0); print(bpy.app.version_string)'
      - name: Install MPFB and Rigify from official Blender extension catalog
        env:
          BLENDER_USER_CONFIG: ${{ runner.temp }}/blender-settings
          BLENDER_USER_EXTENSIONS: ${{ runner.temp }}/blender-extensions
          BLENDER_USER_SCRIPTS: ${{ runner.temp }}/blender-user-scripts
        run: |
          set -euo pipefail
          BLENDER=/tmp/aetherfall-blender-4.5/blender
          "$BLENDER" --online-mode --command extension sync
          "$BLENDER" --online-mode --command extension install -e blender_org.mpfb
          # Rigify isn't currently available from Blender's extension catalog.
          # Install the original GPL code from Blender's published source.
          git clone --depth 1 --filter=blob:none --sparse https://projects.blender.org/blender/blender-addons.git "$RUNNER_TEMP/blender-addons"
          git -C "$RUNNER_TEMP/blender-addons" sparse-checkout set rigify
          mkdir -p "$BLENDER_USER_SCRIPTS/addons"
          cp -a "$RUNNER_TEMP/blender-addons/rigify" "$BLENDER_USER_SCRIPTS/addons/rigify"
          test -f "$BLENDER_USER_SCRIPTS/addons/rigify/__init__.py"
          "$BLENDER" --online-mode --command extension list
          "$BLENDER" -b --python tools/check_mpfb_rigify.py
      - name: Generate MPFB anime body and actual Rigify rig
        env:
          BLENDER_USER_CONFIG: ${{ runner.temp }}/blender-settings
          BLENDER_USER_EXTENSIONS: ${{ runner.temp }}/blender-extensions
          BLENDER_USER_SCRIPTS: ${{ runner.temp }}/blender-user-scripts
        run: |
          set -euo pipefail
          timeout 180s /tmp/aetherfall-blender-4.5/blender -b -t 2 --python tools/generate_mpfb_rigify_anime.py
          test -s builds/Aetherfall-MPFB-Rigify-Anime-Prototype.blend
          test -s builds/Aetherfall-MPFB-Rigify-Anime-Prototype.glb
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("builds/Aetherfall-MPFB-Rigify-Anime-Prototype.json").read_text())
          assert data["vertices"]>10000 and data["deform_bones"]>15, data
          print("MPFB_RIGIFY_MODEL_VALID",data)
          PY
      - name: Set up Godot 4.6.3 for independent GLB import test
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false
      - name: Verify MPFB Rigify prototype GLB imports with skeleton and skin
        run: |
          set -euo pipefail
          mkdir -p builds/mpfb-godot-probe
          cp builds/Aetherfall-MPFB-Rigify-Anime-Prototype.glb builds/mpfb-godot-probe/prototype.glb
          cp tests/mpfb_prototype_model_test.gd builds/mpfb-godot-probe/check.gd
          printf 'config_version=5\n\n[application]\nconfig/name="Aetherfall MPFB Asset Probe"\n' > builds/mpfb-godot-probe/project.godot
          timeout 90s godot --headless --editor --path builds/mpfb-godot-probe --import --quit 2>&1 | tee builds/mpfb-godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:.*(Failed|Invalid)' builds/mpfb-godot-import.log; then
            exit 1
          fi
          timeout 60s godot --headless --path builds/mpfb-godot-probe --script res://check.gd 2>&1 | tee builds/mpfb-godot-test.log
          grep -q 'MPFB_GODOT_IMPORT_OK' builds/mpfb-godot-test.log
      - name: Upload anime character prototype
        uses: actions/upload-artifact@v4
        with:
          name: Aetherfall-MPFB-Rigify-Anime-Prototype
          path: |
            builds/Aetherfall-MPFB-Rigify-Anime-Prototype.blend
            builds/Aetherfall-MPFB-Rigify-Anime-Prototype.glb
            builds/Aetherfall-MPFB-Rigify-Anime-Prototype.json
          if-no-files-found: error
          retention-days: 21
      - name: Upload installation verification
        uses: actions/upload-artifact@v4
        with:
          name: Aetherfall-MPFB-Rigify-Verification
          path: builds/aetherfall_addons_verified.json
          if-no-files-found: error
