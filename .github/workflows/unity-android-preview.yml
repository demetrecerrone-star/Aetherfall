name: Aetherfall Unity Android Preview

on:
  push:
    branches:
      - unity-reboot
    paths:
      - 'Aetherfall-Unity/**'
      - '.github/workflows/unity-android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate Unity login project
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run source and artwork checks
        working-directory: Aetherfall-Unity
        run: |
          python3 -m pip install --user pillow
          python3 tests/test_project_contract.py

  license-readiness:
    name: Inspect Unity builder readiness
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [[ -n "$UNITY_SERIAL" && -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Supported Unity serial credentials found for a GameCI attempt.'
          elif [[ -n "$UNITY_LICENSE" && -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Unity license-file credentials found for a GameCI attempt.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'No supported GameCI activation credentials are configured. Source validation can run.'
            echo 'For Unity Personal or phone-only setup, connect this branch to Unity Cloud Build Automation.'
          fi

  build-android:
    name: Build installable Unity Android APK
    needs: [validate-source, license-readiness]
    if: needs.license-readiness.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Compile Android preview using Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: Aetherfall-Unity
          unityVersion: auto
          targetPlatform: Android
          buildMethod: Aetherfall.Editor.AetherfallProjectSetup.BuildAndroidPreview
          versioning: None
      - name: Verify APK archive
        run: |
          set -euo pipefail
          apk="Aetherfall-Unity/Builds/Aetherfall-Unity-Login-Preview.apk"
          test -s "$apk"
          unzip -t "$apk" | tail -1
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Aetherfall-Unity-Login-Preview-APK
          path: Aetherfall-Unity/Builds/Aetherfall-Unity-Login-Preview.apk
          if-no-files-found: error
          retention-days: 30
