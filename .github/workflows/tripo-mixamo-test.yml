name: Aetherfall Tripo Mixamo Character Test APK

on:
  push:
    branches: ["feature/tripo-mixamo-character-test"]
    paths:
      - "tripo_uploads/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tripo-android-test:
    name: Verify rigged Tripo GLB and export Android test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout isolated Tripo character test branch
        uses: actions/checkout@v4

      - name: Select phone-uploaded model and validate real skin/animations
        run: |
          set -euo pipefail
          MODEL_FILE="$(find tripo_uploads -type f -iname '*.glb' -print -quit)"
          if [[ -z "$MODEL_FILE" ]]; then
            echo "::error::Upload the Tripo .glb file to tripo_uploads/ from GitHub on your phone."
            exit 1
          fi
          python3 tools/check_tripo_gltf.py "$MODEL_FILE"
          mkdir -p tripo_lab/models
          cp "$MODEL_FILE" tripo_lab/models/tripo_adventurer.glb
          test -s tripo_lab/models/tripo_adventurer.glb
          ! grep -q 'com.demetrecerrone.aetherfall"' tripo_lab/export_presets.cfg
          grep -q "com.demetrecerrone.aetherfall.tripotest" tripo_lab/export_presets.cfg
          mkdir -p builds
          sha256sum "$MODEL_FILE" | tee builds/tripo-source-sha256.txt

      - name: Set up Godot 4.6.3 with Android templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Import textured Tripo Mixamo skin and embedded animation clips
        run: |
          set -euo pipefail
          godot --headless --editor --path tripo_lab --import --quit \
            2>&1 | tee builds/tripo-godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:.*(Failed|Invalid|Cannot)' builds/tripo-godot-import.log; then exit 1; fi

      - name: Verify imported 65-joint character and walk/run playback
        run: |
          set -euo pipefail
          godot --headless --path tripo_lab --script res://test_tripo.gd \
            2>&1 | tee builds/tripo-godot-test.log
          grep -q "AETHERFALL_TRIPO_IMPORT_OK" builds/tripo-godot-test.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:.*(Failed|Invalid|Cannot)' builds/tripo-godot-test.log; then exit 1; fi

      - name: Smoke launch 3D Tripo test stage
        run: |
          set -euo pipefail
          godot --headless --path tripo_lab --quit-after 25 \
            2>&1 | tee builds/tripo-godot-smoke.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:.*(Failed|Invalid|Cannot)' builds/tripo-godot-smoke.log; then exit 1; fi

      - name: Set up Java 17 and Android SDK packages
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and Godot editor settings
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' \
            > "$HOME/.config/godot/editor_settings-4.6.tres"
          printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_HOME" \
            >> "$HOME/.config/godot/editor_settings-4.6.tres"
          printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME" \
            >> "$HOME/.config/godot/editor_settings-4.6.tres"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Sign isolated test package using existing Aetherfall keystore
        env:
          KEYSTORE_B64: ${{ secrets.AETHERFALL_KEYSTORE_B64 || secrets.AETHERFALL_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.AETHERFALL_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.AETHERFALL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::Missing keystore base64 secret"; exit 1; }
          test -n "$KEYSTORE_ALIAS" || { echo "::error::Missing keystore alias"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing keystore password"; exit 1; }
          umask 077
          STORE="$RUNNER_TEMP/aetherfall-tripo.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$STORE"
          keytool -list -keystore "$STORE" -alias "$KEYSTORE_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$STORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Export and check directly installable Tripo character APK
        run: |
          set -euo pipefail
          APK="$PWD/builds/Aetherfall-Tripo-Mixamo-Test.apk"
          godot --headless --path tripo_lab \
            --export-debug "Tripo Mixamo Test Android" "$APK" \
            2>&1 | tee builds/tripo-android-export.log
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK" \
            | tee builds/tripo-apk-info.log
          grep -q "package: name='com.demetrecerrone.aetherfall.tripotest'" builds/tripo-apk-info.log
          echo "### Tripo Mixamo model tested; signed side-by-side Aetherfall QA APK ready." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Tripo Mixamo APK and verification logs
        uses: actions/upload-artifact@v4
        with:
          name: Aetherfall-Tripo-Mixamo-Character-TEST-APK
          path: |
            builds/Aetherfall-Tripo-Mixamo-Test.apk
            builds/tripo-*.log
            builds/tripo-source-sha256.txt
          if-no-files-found: error
          retention-days: 21
