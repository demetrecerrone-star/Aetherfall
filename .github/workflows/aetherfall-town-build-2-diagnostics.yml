name: Aetherfall Town Build 2 Diagnostics

on:
  push:
    branches: [main]
    paths: ['.github/workflows/aetherfall-town-build-2-diagnostics.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-build2:
    name: Read Town Preview Build 2 status and failure metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unity-reboot
          persist-credentials: false
      - name: Read-only sanitized Unity report for specific town preview Build 2
        env:
          UNITY_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_KEY_ID }}
          UNITY_SERVICE_ACCOUNT_SECRET_KEY: ${{ secrets.UNITY_SERVICE_ACCOUNT_SECRET_KEY }}
          UNITY_CLOUD_ORG_ID: '2476066025878'
          UNITY_CLOUD_PROJECT_ID: '92204c56-3bcf-41b8-8eec-43d1069287a1'
          UNITY_CLOUD_TARGET_ID: 'aetherfall-town-preview'
        run: |
          python3 tools/unity_cloud_report.py --self-test
          python3 tools/unity_cloud_report.py --build 2
