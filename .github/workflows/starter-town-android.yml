name: Aetherfall Starter Town Android APK

on:
  push:
    branches: [feature/cleanroom-starter-town, feature/quaternius-scenery-upgrade, feature/starter-town-pass3-valley, feature/quaternius-nature-megakit-import, feature/avatar-creator-v065-town-integration, feature/universal-characters-rebuild, feature/tripo-peasant-playable-test]
    paths:
      - "cleanroom/models/*.glb"
      - "cleanroom/starter_town.gd"
      - "cleanroom/peasant_gear.gd"
      - "cleanroom/tests/market_camera_visibility_test.gd"
      - "cleanroom/models/universal/*.bin"
      - "cleanroom/models/tripo/*.bin"
      - "cleanroom/tests/tripo_peasant_preview_test.gd"
      - "cleanroom/universal_character_manifest.json"
      - "cleanroom/creator_v065/*.gd"
      - "cleanroom/models/creator_v065/*.bin"
      - "cleanroom/tools/add_v065_locomotion.py"
      - "cleanroom/tools/retarget_v065_authored.py"
      - "cleanroom/graphics_quality.gd"
      - "cleanroom/tests/performance_optimization_test.gd"
      - "cleanroom/hanging_shop_signs.gd"
      - "cleanroom/signs/*.svg"
      - "cleanroom/tests/hanging_signs_test.gd"
      - "cleanroom/tests/market_decorations_test.gd"
      - "cleanroom/models/fountain/*.glb"
      - "cleanroom/tests/fountain_asset_test.gd"
      - "cleanroom/nature_replacements.gd"
      - "cleanroom/tools/install_nature_megakit.py"
      - "cleanroom/tests/nature_asset_test.gd"
      - "Aetherfall-Nature-Assets-For-GitHub.zip"
      - "cleanroom/scenery_replacements.gd"
      - "cleanroom/grass_field.gd"
      - "cleanroom/road_network.gd"
      - "cleanroom/mountain_valley.gd"
      - "cleanroom/zone_transfer.gd"
      - "cleanroom/tests/scenery_asset_test.gd"
      - "Aetherfall-Scenery-Assets-For-GitHub.zip"
      - "cleanroom/export_presets.cfg"
      - ".github/workflows/starter-town-android.yml"
      - "cleanroom/tests/verify_pack_model.gd"
      - "cleanroom/tests/character_switch_test.gd"
      - "cleanroom/tests/environment_texture_test.gd"
      - "cleanroom/tests/collision_camera_test.gd"
      - "cleanroom/tests/sprint_multitouch_test.gd"
      - "cleanroom/tools/merge_female_animations.py"
      - "cleanroom/tools/fetch_town_textures.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-starter-town:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout cleanroom project
        uses: actions/checkout@v4

      - name: Install optimized Quaternius scenery assets
        if: contains(fromJSON('["feature/quaternius-scenery-upgrade","feature/starter-town-pass2-roads","feature/starter-town-pass3-valley","feature/quaternius-nature-megakit-import","feature/avatar-creator-v065-town-integration","feature/universal-characters-rebuild","feature/tripo-peasant-playable-test"]'), github.ref_name)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path("Aetherfall-Scenery-Assets-For-GitHub.zip")
          if not archive.is_file():
              raise SystemExit("Upload Aetherfall-Scenery-Assets-For-GitHub.zip to the scenery branch root before building.")
          expected = set("House_1 House_2 House_3 House_4 Inn Blacksmith MarketStand_1 MarketStand_2 Stall_Empty Barrel Crate_Wooden FarmCrate_Apple Anvil Lantern_Wall BirchTree_1 MapleTree_1 Bush Bush_Large Bush_Flowers Grass_Small".split())
          with ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit("Corrupt scenery archive member: " + bad)
              entries = set(z.namelist())
              for name in expected:
                  if "models/scenery/" + name + ".glb" not in entries:
                      raise SystemExit("Missing required optimized scenery model: " + name)
              for member in z.infolist():
                  p = Path(member.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit("Unsafe path in scenery archive: " + member.filename)
              z.extractall("cleanroom")
          for name in expected:
              raw = (Path("cleanroom/models/scenery") / (name + ".glb")).read_bytes()
              if len(raw) < 1000 or raw[:4] != b"glTF" or int.from_bytes(raw[8:12], "little") != len(raw):
                  raise SystemExit("Invalid optimized scenery GLB: " + name)
          print(f"Prepared {len(expected)} optimized CC0 Quaternius scenery GLBs")
          PY

      - name: Install checked Quaternius Stylized Nature MegaKit
        if: contains(fromJSON('["feature/quaternius-nature-megakit-import","feature/avatar-creator-v065-town-integration","feature/universal-characters-rebuild","feature/tripo-peasant-playable-test"]'), github.ref_name)
        run: |
          python3 -m pip install --quiet --break-system-packages 'Pillow>=10,<13'
          python3 cleanroom/tools/install_nature_megakit.py

      - name: Verify complete Universal Base playable characters
        if: contains(fromJSON('["feature/universal-characters-rebuild","feature/tripo-peasant-playable-test"]'), github.ref_name)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          for gender in ("male","female"):
              f=Path("cleanroom/models/universal")/(gender+"_runtime.bin")
              raw=f.read_bytes()
              assert raw[:4]==b"glTF" and struct.unpack_from("<I",raw,8)[0]==len(raw)
              n=struct.unpack_from("<I",raw,12)[0]
              d=json.loads(raw[20:20+n])
              assert len(d["skins"][0]["joints"])==65
              assert len(d["animations"])==25
              required={"Idle_Loop","Walk_Loop","Sprint_Loop","Sword_Attack","Sword_Block","Interact"}
              assert required <= {c["name"] for c in d["animations"]}
              assert len(d.get("images",[]))>=1, "Missing embedded textures"
              print("AETHERFALL_UNIVERSAL_READY",gender,len(raw),"bytes")
          PY
          grep -F 'models/universal/*.bin' cleanroom/export_presets.cfg
          ! grep -q 'res://models/creator_v065' cleanroom/starter_town.gd

      - name: Verify exact runtime Mixamo GLB
        if: !contains(fromJSON('["feature/universal-characters-rebuild","feature/tripo-peasant-playable-test"]'), github.ref_name)
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          path = Path("cleanroom/models/anime+adventurer+3d+model (1).glb")
          if not path.is_file():
              raise SystemExit("Missing seven-clip character GLB in cleanroom/models")
          raw = path.read_bytes()
          if raw[:4] != b"glTF" or len(raw) < 20:
              raise SystemExit("Model is not a valid binary GLB")
          json_len = struct.unpack_from("<I", raw, 12)[0]
          gltf = json.loads(raw[20:20+json_len].decode("utf-8").rstrip(" \x00"))
          joint_counts = [len(skin.get("joints", [])) for skin in gltf.get("skins", [])]
          animations = {str(a.get("name", "")).lower() for a in gltf.get("animations", [])}
          required = {"standing_relax", "idle", "look_around", "walk", "run", "jump", "sit"}
          if 65 not in joint_counts or not required <= animations:
              raise SystemExit(f"Expected 65-joint Mixamo rig with all seven clips, got joints={joint_counts}, clips={animations}")
          mesh = gltf["meshes"][0]["primitives"][0]
          vertices = gltf["accessors"][mesh["attributes"]["POSITION"]]["count"]
          if vertices != 15562:
              raise SystemExit(f"Unexpected character mesh vertex count: {vertices}")
          print(f"Validated: {path.stat().st_size:,} bytes; skins={joint_counts}; animations={sorted(animations)}")
          PY

      - name: Prepare export-safe raw character bytes
        if: !contains(fromJSON('["feature/universal-characters-rebuild","feature/tripo-peasant-playable-test"]'), github.ref_name)
        run: |
          set -euo pipefail
          SOURCE="cleanroom/models/anime+adventurer+3d+model (1).glb"
          RAW="cleanroom/models/adventurer_runtime.bin"
          cp "$SOURCE" "$RAW"
          cmp "$SOURCE" "$RAW"
          test "$(stat -c%s "$RAW")" -gt 3000000
          echo "Runtime raw binary ready: $(stat -c%s "$RAW") bytes"
          grep -F 'models/universal/*.bin' cleanroom/export_presets.cfg || test "$GITHUB_REF_NAME" != "feature/tripo-peasant-playable-test"
          grep -F 'const MALE_MODEL_PATH := "res://models/adventurer_runtime.bin"' cleanroom/starter_town.gd
          grep -F 'const FEMALE_MODEL_PATH := "res://models/adventurer_female_runtime.bin"' cleanroom/starter_town.gd
          python3 cleanroom/tools/merge_female_animations.py \
            --male "cleanroom/models/anime+adventurer+3d+model (1).glb" \
            --female "cleanroom/models/Female+anime+adventurer+3d+model (2).glb" \
            --output cleanroom/models/adventurer_female_runtime.bin
          test "$(stat -c%s cleanroom/models/adventurer_female_runtime.bin)" -gt 3000000

      - name: Retarget real authored Mixamo full-body locomotion onto v0.6.5 male
        if: github.ref_name == 'feature/avatar-creator-v065-town-integration'
        run: |
          set -euo pipefail
          python3 cleanroom/tools/retarget_v065_authored.py \
            cleanroom/models/creator_v065/male_refined.bin \
            'cleanroom/models/anime+adventurer+3d+model (1).glb' \
            cleanroom/models/creator_v065/male_playable.bin
          test "$(stat -c%s cleanroom/models/creator_v065/male_playable.bin)" -gt 11000000
          grep -F 'const CREATOR_V065_MALE_MODEL_PATH := "res://models/creator_v065/male_playable.bin"' cleanroom/starter_town.gd
          # Confirm authentic timing/locomotion WITHOUT the 40 incompatible
          # Mixamo finger tracks that caused stretched branch-like hands.
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          base=Path("cleanroom/models/creator_v065/male_refined.bin").read_bytes()
          result=Path("cleanroom/models/creator_v065/male_playable.bin").read_bytes()
          def doc(b):
              n=struct.unpack_from("<I",b,12)[0]
              return json.loads(b[20:20+n])
          original,animated=doc(base),doc(result)
          for key in ("meshes","skins","materials","nodes"):
              assert original[key]==animated[key],f"Creator rig/appearance changed: {key}"
          clips={x["name"]:x for x in animated["animations"]}
          assert len(clips)==8
          for clip in ("standing_relax","idle","walk","run"):
              channels=clips[clip]["channels"]
              assert 22<=len(channels)<=24, (clip,len(channels))
              names=[animated["nodes"][c["target"]["node"]]["name"] for c in channels]
              assert not any(n.startswith(("index_","middle_","ring_","pinky_","thumb_")) for n in names),clip
              assert {"thigh_l","thigh_r","calf_l","calf_r","upperarm_l","upperarm_r","hand_l","hand_r"} <= set(names),clip
          idle=clips["standing_relax"]
          ai=idle["samplers"][0]["input"]
          assert animated["accessors"][ai]["max"][0]>10.0, "Expected authored long-form relaxed idle"
          print("AETHERFALL_ANIM_AUTHORED_OK: original v0.6.5 meshes, 24 safe body joints, 40 static hand/finger joints, long-form authored idle")
          PY

      - name: Fetch and validate seven CC0 Poly Haven diffuse maps
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check "Pillow==11.3.0"
          python3 cleanroom/tools/fetch_town_textures.py
          test "$(find cleanroom/textures -maxdepth 1 -name '*.bin' | wc -l)" -eq 7
          grep -F 'models/universal/*.bin' cleanroom/export_presets.cfg

      - name: Fetch optional licensed Poly Haven sky
        run: |
          mkdir -p cleanroom/environment
          if curl -fsSL --retry 3 --connect-timeout 12 \
              "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/kloppenheim_03_puresky_1k.hdr" \
              -o cleanroom/environment/kloppenheim_03_puresky_1k.hdr; then
            echo "4398fb83b085aed97cef788cda6f9e2d  cleanroom/environment/kloppenheim_03_puresky_1k.hdr" | md5sum -c -
          else
            echo "HDRI unavailable: procedural sky fallback remains enabled"
            rm -f cleanroom/environment/kloppenheim_03_puresky_1k.hdr
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.6.3 Android templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Configure Android build tools
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$HOME/.config/godot/editor_settings-4.6.tres"
          printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_HOME" >> "$HOME/.config/godot/editor_settings-4.6.tres"
          printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME" >> "$HOME/.config/godot/editor_settings-4.6.tres"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Verify reusable signing identity
        env:
          KEYSTORE_B64: ${{ secrets.AETHERFALL_KEYSTORE_B64 || secrets.AETHERFALL_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.AETHERFALL_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.AETHERFALL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_ALIAS" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::Missing Aetherfall reusable signing secrets"
            exit 1
          fi
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/aetherfall-upload.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -alias "$KEYSTORE_ALIAS" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE_PATH"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$KEYSTORE_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Increment Android version for each test
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("cleanroom/export_presets.cfg")
          text = path.read_text()
          version = 100000000 + int(os.environ["GITHUB_RUN_NUMBER"])
          text = re.sub(r"version/code=\d+", f"version/code={version}", text, count=1)
          text = re.sub(r'version/name="[^"]+"', f'version/name="pass3-scenery.{os.environ["GITHUB_RUN_NUMBER"]}"', text, count=1)
          path.write_text(text)
          print("Android version code:", version)
          PY

      - name: Parse and import Starter Town
        run: |
          set -euo pipefail
          godot --headless --path cleanroom --check-only --script res://starter_town.gd
          godot --headless --path cleanroom --check-only --script res://peasant_gear.gd
          godot --headless --editor --path cleanroom --quit

      - name: Validate all 20 imported Quaternius models
        if: contains(fromJSON('["feature/quaternius-scenery-upgrade","feature/starter-town-pass2-roads","feature/starter-town-pass3-valley","feature/quaternius-nature-megakit-import","feature/avatar-creator-v065-town-integration","feature/universal-characters-rebuild","feature/tripo-peasant-playable-test"]'), github.ref_name)
        run: |
          set -o pipefail
          godot --headless --path cleanroom --script res://tests/scenery_asset_test.gd 2>&1 | tee /tmp/scenery-assets-qa.log
          grep -F 'AETHERFALL_SCENERY_ASSETS_OK' /tmp/scenery-assets-qa.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|AETHERFALL_SCENERY_FAIL' /tmp/scenery-assets-qa.log; then exit 1; fi

      - name: Verify real imported nature models and optimized grass
        if: contains(fromJSON('["feature/quaternius-nature-megakit-import","feature/avatar-creator-v065-town-integration","feature/universal-characters-rebuild","feature/tripo-peasant-playable-test"]'), github.ref_name)
        run: |
          set -o pipefail
          godot --headless --path cleanroom --script res://tests/nature_asset_test.gd 2>&1 | tee /tmp/nature-assets-qa.log
          grep -F 'AETHERFALL_NATURE_ASSETS_OK' /tmp/nature-assets-qa.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|AETHERFALL_NATURE_ASSETS_FAIL' /tmp/nature-assets-qa.log; then exit 1; fi

      - name: Verify graphics optimisation and optional on-device performance instrumentation
        if: contains(fromJSON('["feature/quaternius-nature-megakit-import","feature/avatar-creator-v065-town-integration","feature/universal-characters-rebuild","feature/tripo-peasant-playable-test"]'), github.ref_name)
        run: |
          set -o pipefail
          godot --headless --path cleanroom --script res://tests/performance_optimization_test.gd 2>&1 | tee /tmp/performance-optimisation-qa.log
          grep -F 'AETHERFALL_PERFORMANCE_OPT_OK' /tmp/performance-optimisation-qa.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|AETHERFALL_PERFORMANCE_OPT_FAIL:' /tmp/performance-optimisation-qa.log; then exit 1; fi

      - name: Inspect imported market counter geometry
        if: contains(fromJSON('["feature/quaternius-nature-megakit-import","feature/avatar-creator-v065-town-integration","feature/universal-characters-rebuild","feature/tripo-peasant-playable-test"]'), github.ref_name)
        run: |
          set -o pipefail
          godot --headless --path cleanroom --script res://tests/market_counter_geometry_probe.gd 2>&1 | tee /tmp/market-counter-probe.log
          grep -F 'MARKET_PROBE_OK' /tmp/market-counter-probe.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|MARKET_PROBE_FAIL' /tmp/market-counter-probe.log; then exit 1; fi

      - name: Pass 4.2 authentic marketplace decoration with retained street assets
        if: contains(fromJSON('["feature/quaternius-nature-megakit-import","feature/avatar-creator-v065-town-integration","feature/universal-characters-rebuild","feature/tripo-peasant-playable-test"]'), github.ref_name)
        run: |
          set -o pipefail
          godot --headless --path cleanroom --script res://tests/market_decorations_test.gd 2>&1 | tee /tmp/market-decor-qa.log
          grep -F 'AETHERFALL_MARKET_DECOR_OK' /tmp/market-decor-qa.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|AETHERFALL_MARKET_DECOR_FAIL:' /tmp/market-decor-qa.log; then exit 1; fi

      - name: Pass 4.1 four unique hanging shop signs and unobstructed entryways
        if: contains(fromJSON('["feature/quaternius-nature-megakit-import","feature/avatar-creator-v065-town-integration","feature/universal-characters-rebuild","feature/tripo-peasant-playable-test"]'), github.ref_name)
        run: |
          set -o pipefail
          godot --headless --path cleanroom --script res://tests/hanging_signs_test.gd 2>&1 | tee /tmp/hanging-signs-qa.log
          grep -F 'AETHERFALL_HANGING_SIGNS_OK' /tmp/hanging-signs-qa.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|AETHERFALL_HANGING_SIGNS_FAIL:' /tmp/hanging-signs-qa.log; then exit 1; fi

      - name: Verify authentic user fountain asset and playable square
        if: contains(fromJSON('["feature/quaternius-nature-megakit-import","feature/avatar-creator-v065-town-integration","feature/universal-characters-rebuild","feature/tripo-peasant-playable-test"]'), github.ref_name)
        run: |
          set -o pipefail
          godot --headless --path cleanroom --script res://tests/fountain_asset_test.gd 2>&1 | tee /tmp/fountain-qa.log
          grep -F 'AETHERFALL_AUTHENTIC_FOUNTAIN_OK' /tmp/fountain-qa.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|AETHERFALL_AUTHENTIC_FOUNTAIN_FAIL:' /tmp/fountain-qa.log; then exit 1; fi

      - name: Runtime smoke test imported animation playback
        run: |
          set -o pipefail
          godot --headless --path cleanroom --quit-after 45 2>&1 | tee /tmp/starter-town-runtime.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|TRIPO_RUNTIME_FAIL:|AETHERFALL_DIAGNOSTIC|ERROR:.*(Invalid|Cannot|Failed)' /tmp/starter-town-runtime.log; then
            exit 1
          fi

      - name: Validate male / female toggle and movement on imported rigs
        run: |
          set -o pipefail
          godot --headless --path cleanroom --script res://tests/character_switch_test.gd 2>&1 | tee /tmp/character-switch-qa.log
          grep -F 'AETHERFALL_CHARACTER_SWITCH_OK' /tmp/character-switch-qa.log
          if grep -Ei 'SCRIPT ERROR:|AETHERFALL_CHARACTER_QA_FAIL|TRIPO_RUNTIME_FAIL:|AETHERFALL_DIAGNOSTIC' /tmp/character-switch-qa.log; then
            exit 1
          fi

      - name: Check polished ground, market square, and material surfaces
        run: |
          set -o pipefail
          godot --headless --path cleanroom --script res://tests/environment_texture_test.gd 2>&1 | tee /tmp/environment-qa.log
          grep -F 'AETHERFALL_ENVIRONMENT_PASS3_OK' /tmp/environment-qa.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|AETHERFALL_ENVIRONMENT_FAIL:' /tmp/environment-qa.log; then
            exit 1
          fi

      - name: Verify market canopy is camera-transparent but walls remain solid
        run: |
          set -o pipefail
          godot --headless --path cleanroom --script res://tests/market_camera_visibility_test.gd 2>&1 | tee /tmp/market-camera-qa.log
          grep -F 'AETHERFALL_MARKET_CAMERA_OK' /tmp/market-camera-qa.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|AETHERFALL_MARKET_CAMERA_FAIL:' /tmp/market-camera-qa.log; then exit 1; fi

      - name: Test doorway and camera collision regression
        run: |
          set -o pipefail
          godot --headless --path cleanroom --script res://tests/collision_camera_test.gd 2>&1 | tee /tmp/collision-camera-qa.log
          grep -F 'AETHERFALL_COLLISION_CAMERA_PASS3_OK' /tmp/collision-camera-qa.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|AETHERFALL_COLLISION_CAMERA_FAIL' /tmp/collision-camera-qa.log; then
            exit 1
          fi

      - name: Test multitouch joystick and sprint toggle
        run: |
          set -o pipefail
          godot --headless --path cleanroom --script res://tests/sprint_multitouch_test.gd 2>&1 | tee /tmp/sprint-touch-qa.log
          grep -F 'AETHERFALL_SPRINT_TOUCH_OK' /tmp/sprint-touch-qa.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|AETHERFALL_SPRINT_TOUCH_FAIL' /tmp/sprint-touch-qa.log; then
            exit 1
          fi

      - name: Verify model INSIDE exported Android resource pack
        run: |
          set -euo pipefail
          mkdir -p cleanroom/builds "$RUNNER_TEMP/pack-audit"
          godot --headless --path cleanroom --export-pack Android "$GITHUB_WORKSPACE/cleanroom/builds/Aetherfall-StarterTown-Pass3.pck"
          test -s cleanroom/builds/Aetherfall-StarterTown-Pass3.pck
          printf 'config_version=5\n\n[application]\nconfig/name="Aetherfall Pack Audit"\n' > "$RUNNER_TEMP/pack-audit/project.godot"
          cp cleanroom/tests/verify_pack_model.gd "$RUNNER_TEMP/pack-audit/verify_pack_model.gd"
          export AETHERFALL_PACK_FILE="$GITHUB_WORKSPACE/cleanroom/builds/Aetherfall-StarterTown-Pass3.pck"
          godot --headless --path "$RUNNER_TEMP/pack-audit" --script res://verify_pack_model.gd

      - name: Export signed Aetherfall Starter Town APK
        run: |
          mkdir -p cleanroom/builds
          (cd cleanroom && godot --headless --path . --export-debug Android builds/Aetherfall-StarterTown-Pass3.apk)
          test -s cleanroom/builds/Aetherfall-StarterTown-Pass3.apk

      - name: Verify APK signing certificate
        env:
          KEYSTORE_ALIAS: ${{ secrets.AETHERFALL_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.AETHERFALL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="cleanroom/builds/Aetherfall-StarterTown-Pass3.apk"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$APK"
          ACTUAL=$("$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --print-certs "$APK" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d '[:space:]')
          EXPECTED=$(keytool -exportcert -alias "$KEYSTORE_ALIAS" -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" -storepass "$KEYSTORE_PASSWORD" | sha256sum | awk '{print $1}')
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

