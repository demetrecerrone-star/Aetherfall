name: Aetherfall Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Godot and templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Import and validate project
        run: godot --headless --editor --path . --quit

      - name: Export signed Android debug APK
        run: |
          mkdir -p builds
          godot --headless --path . --export-debug "Android" "builds/Aetherfall-v0.1-debug.apk"
          test -s builds/Aetherfall-v0.1-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Aetherfall-v0.1-Android-Debug
          path: builds/Aetherfall-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
