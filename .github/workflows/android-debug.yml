name: Aetherfall Android Debug APK

on:
  push:
    branches: [main, "fix/**", "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot and templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Configure Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$HOME/.config/godot/editor_settings-4.6.tres"
          printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_HOME" >> "$HOME/.config/godot/editor_settings-4.6.tres"
          printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME" >> "$HOME/.config/godot/editor_settings-4.6.tres"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Require persistent Aetherfall signing key
        env:
          KEYSTORE_B64: ${{ secrets.AETHERFALL_KEYSTORE_B64 }}
          KEYSTORE_ALIAS: ${{ secrets.AETHERFALL_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.AETHERFALL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_ALIAS" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::Aetherfall permanent signing is not available. Configure AETHERFALL_KEYSTORE_B64, AETHERFALL_KEY_ALIAS and AETHERFALL_KEY_PASSWORD as Actions secrets for THIS repository (or an organization secret explicitly shared with THIS repository). Refusing to export an APK signed with a throwaway key."
            exit 1
          fi
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/aetherfall-upload.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::AETHERFALL_KEYSTORE_B64 decoded to an empty keystore."
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_PATH" -alias "$KEYSTORE_ALIAS" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::The Aetherfall keystore cannot be opened with the provided password and alias. Check the 3 Actions secrets."
            exit 1
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "Aetherfall reusable signing identity verified. Build may proceed."

      - name: Generate original skinned anime glTF character
        run: |
          python3 tools/generate_avatar_v031.py
          test -s assets/characters/aetherfall_adventurer.gltf
          ls -lh assets/characters/aetherfall_adventurer.gltf

      - name: Godot import all generated 3D assets
        run: godot --headless --editor --path . --quit

      - name: Smoke-test first scene for runtime errors
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 10 2>&1 | tee smoke.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:.*(Invalid|Cannot|Failed)' smoke.log; then
            exit 1
          fi

      - name: Import and validate project
        run: godot --headless --editor --path . --quit

      - name: Check imported skinned anime humanoid rig and animation
        run: godot --headless --path . --script res://tests/model_asset_test.gd

      - name: Test character studio live preview and local save
        run: godot --headless --path . --script res://tests/studio_preview_test.gd

      - name: Export signed Android debug APK
        run: |
          mkdir -p builds
          godot --headless --path . --export-debug "Android" "builds/Aetherfall-v0.3.1-debug.apk"
          test -s builds/Aetherfall-v0.3.1-debug.apk

      - name: Verify release APK carries the configured signing certificate
        env:
          KEYSTORE_ALIAS: ${{ secrets.AETHERFALL_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.AETHERFALL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="builds/Aetherfall-v0.3.1-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$APK"
          ACTUAL=$("$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --print-certs "$APK" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d '[:space:]')
          EXPECTED=$(keytool -exportcert -alias "$KEYSTORE_ALIAS" -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" -storepass "$KEYSTORE_PASSWORD" | sha256sum | awk '{print $1}')
          if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Exported APK signature does not match the persistent keystore. Refusing to publish the APK."
            exit 1
          fi
          echo "Signing certificate SHA-256: $ACTUAL"
          echo "### Aetherfall v0.3.1 APK uses the configured persistent signing identity." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish source model glTF for inspection
        uses: actions/upload-artifact@v4
        with:
          name: Aetherfall-v0.3.1-Source-Rigged-Model
          path: assets/characters/aetherfall_adventurer.gltf
          if-no-files-found: error
          retention-days: 30

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Aetherfall-v0.3.1-Android-Debug
          path: builds/Aetherfall-v0.3.1-debug.apk
          if-no-files-found: error
          retention-days: 30
