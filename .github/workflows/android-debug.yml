name: Aetherfall Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot and templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Configure Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$HOME/.config/godot/editor_settings-4.6.tres"
          printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_HOME" >> "$HOME/.config/godot/editor_settings-4.6.tres"
          printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME" >> "$HOME/.config/godot/editor_settings-4.6.tres"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Configure signing (repository secrets optional for stable updates)
        env:
          KEYSTORE_B64: ${{ secrets.AETHERFALL_KEYSTORE_B64 }}
          KEYSTORE_ALIAS: ${{ secrets.AETHERFALL_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.AETHERFALL_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_ALIAS" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/aetherfall-upload.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/aetherfall-upload.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Using repository-managed signing key (private key never committed)."
          else
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 9999
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
            echo "::warning::Temporary test signer: the next APK may require uninstall. Configure repository signing secrets for in-place updates."
          fi

      - name: Smoke-test first scene for runtime errors
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 10 2>&1 | tee smoke.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:.*(Invalid|Cannot|Failed)' smoke.log; then
            exit 1
          fi

      - name: Import and validate project
        run: godot --headless --editor --path . --quit

      - name: Export signed Android debug APK
        run: |
          mkdir -p builds
          godot --headless --path . --export-debug "Android" "builds/Aetherfall-v0.2-debug.apk"
          test -s builds/Aetherfall-v0.2-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Aetherfall-v0.2-Android-Debug
          path: builds/Aetherfall-v0.2-debug.apk
          if-no-files-found: error
          retention-days: 30
