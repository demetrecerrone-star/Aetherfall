name: Male Peasant Authored Blender QA

on:
  workflow_dispatch:
  push:
    branches:
      - feature/male-peasant-v19-apk-test
    paths:
      - "cleanroom/tools/aetherfall_male_peasant_refine.py"
      - "cleanroom/models/tripo/male_peasant_runtime.bin"
      - ".github/workflows/male-peasant-authored-qa.yml"

permissions:
  contents: read

jobs:
  refine-and-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Aetherfall
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy libegl1 libgl1 libglx0
          blender --version

      - name: Prepare runtime GLB
        run: |
          mkdir -p builds/male_peasant_v102
          cp cleanroom/models/tripo/male_peasant_runtime.bin builds/male_peasant_v102/source.glb
          test -s builds/male_peasant_v102/source.glb

      - name: Refine authored garments and render QA
        run: |
          set -o pipefail
          blender -b --python cleanroom/tools/aetherfall_male_peasant_refine.py -- \
            --input builds/male_peasant_v102/source.glb \
            --output builds/male_peasant_v102/AF_Male_Peasant_Authored_v102.glb \
            --report builds/male_peasant_v102/report.json \
            --render-dir builds/male_peasant_v102/renders \
            2>&1 | tee builds/male_peasant_v102/blender.log
          grep -q "AETHERFALL_MALE_PEASANT_V102_OK" builds/male_peasant_v102/blender.log
          test -s builds/male_peasant_v102/report.json

      - name: Validate authored pass
        run: |
          python3 - <<'PY'
          import json
          p="builds/male_peasant_v102/report.json"
          d=json.load(open(p))
          assert d["armature_bones"] == 65, d
          assert d["authored_garment_objects"] > 0, d
          assert d["uses_body_derived_shells"] is False, d
          assert all(x["weight_ratio_after"] >= 0.98 for x in d["garments"]), d
          print("AETHERFALL_AUTHORED_GARMENT_QA_OK", d["parts"])
          PY
          test -s builds/male_peasant_v102/renders/front.png
          test -s builds/male_peasant_v102/renders/front34.png
          test -s builds/male_peasant_v102/renders/side.png
          test -s builds/male_peasant_v102/renders/back.png
          test -s builds/male_peasant_v102/renders/walk_front.png
          test -s builds/male_peasant_v102/renders/run_front.png
          test -s builds/male_peasant_v102/AF_Male_Peasant_Authored_v102.glb

      - name: Upload authored male peasant checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: Aetherfall-Male-Peasant-Authored-v102
          path: builds/male_peasant_v102/
          retention-days: 21
          if-no-files-found: error
        if: always()
